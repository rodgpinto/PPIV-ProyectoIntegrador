# Blueprint de Render para RADAS (plan gratuito). Guía paso a paso en docs/RENDER.md.
# La base de datos NO va en Render (la gratuita vence a los 30 días): se usa Neon y su dirección se pega en DATABASE_URL.
# Sin probar en el entorno donde se armó el proyecto; los campos siguen la especificación de Blueprints de Render.
services:
  - type: web
    name: radas
    runtime: node
    plan: free
    region: ohio
    # --include=dev: la interfaz se compila con esbuild y React, que están como dependencias de desarrollo
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_POOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
